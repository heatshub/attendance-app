<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>出席管理</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="home-page">

  <header class="home-topbar">
    <div class="home-user">{{ username }} さん</div>

    <a href="{{ url_for('timetable_view') }}" class="schedule-button">
      TIMETABLE →
    </a>
  </header>

  <main class="home-main compact">
    <p class="date">{{ today }}</p>
    <div id="clock" class="clock">00:00</div>

    <p class="guide-text">
      開始ボタンを押すと、作業時間がタイムテーブルに記録されます。
    </p>

    {% if is_working %}
      <div class="work-status working">
        <span class="status-dot"></span>
        <div>
          <strong>現在：作業中</strong>
          {% if started_at %}
            <small>開始時刻 {{ started_at }}</small>
          {% endif %}
        </div>
      </div>
    {% else %}
      <div class="work-status">
        <span class="status-dot idle"></span>
        <div>
          <strong>現在：未作業</strong>
          <small>開始ボタンから記録できます</small>
        </div>
      </div>
    {% endif %}

    <div class="action-buttons">
      <form method="POST" action="{{ url_for('attendance_start') }}">
        <button
          type="submit"
          class="glass-btn start {% if is_working %}btn-disabled{% endif %}"
          {% if is_working %}disabled{% endif %}
        >
          開始
        </button>
      </form>

      <form method="POST" action="{{ url_for('attendance_end') }}">
        <button type="submit" class="glass-btn end">
          終了
        </button>
      </form>
    </div>

    <a href="{{ url_for('timetable_view') }}" class="timetable-hero-link">
      View Timetable
    </a>
  </main>

  <script>
    function updateClock() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      document.getElementById("clock").innerText = `${hh}:${mm}`;
    }
    setInterval(updateClock, 1000);
    updateClock();
  </script>

</body>
</html>
